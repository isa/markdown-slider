# High contrast — strong foreground/background separation
# Use in slides: theme: high-contrast

id: high-contrast
name: High contrast
description: Maximum contrast for readability in both app modes.

align: left

dark:
  css:
    --slide-font-heading: system-ui, sans-serif
    --slide-font-body: system-ui, sans-serif
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 3.5rem
    --slide-font-size-h2: 2.75rem
    --slide-font-size-h3: 2rem
    --slide-font-size-body: 1.35rem
    --slide-line-height-body: "1.5"
    --slide-text: "#ffffff"
    --slide-text-muted: "#e5e5e5"
    --slide-heading-color: "#ffff00"
    --slide-heading-h1-color: "#ffff00"
    --slide-heading-h2-color: "#ffff00"
    --slide-heading-h3-color: "#fef08a"
    --slide-accent: "#ffff00"
    --slide-bg: "#000000"
    --slide-bullet-color: "#ffff00"
    --slide-list-spacing: 0.5rem
    --slide-image-radius: "0"
    --slide-image-shadow: none
    --slide-image-max-width: min(100%, 40rem)
    --slide-code-bg: "#171717"
    --slide-code-text: "#ffff00"
    --slide-blockquote-border: "#ffff00"
    --slide-table-border: "#ffffff"
    --slide-table-header-bg: "#262626"
    --slide-column-gap: 1rem
    --slide-entrance: none

light:
  css:
    --slide-font-heading: system-ui, sans-serif
    --slide-font-body: system-ui, sans-serif
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 3.5rem
    --slide-font-size-h2: 2.75rem
    --slide-font-size-h3: 2rem
    --slide-font-size-body: 1.35rem
    --slide-line-height-body: "1.5"
    --slide-text: "#000000"
    --slide-text-muted: "#171717"
    --slide-heading-color: "#000000"
    --slide-heading-h1-color: "#000000"
    --slide-heading-h2-color: "#000000"
    --slide-heading-h3-color: "#171717"
    --slide-accent: "#000000"
    --slide-bg: "#ffff00"
    --slide-bullet-color: "#000000"
    --slide-list-spacing: 0.5rem
    --slide-image-radius: "0"
    --slide-image-shadow: none
    --slide-image-max-width: min(100%, 40rem)
    --slide-code-bg: "#ffffff"
    --slide-code-text: "#000000"
    --slide-blockquote-border: "#000000"
    --slide-table-border: "#000000"
    --slide-table-header-bg: "#fef08a"
    --slide-column-gap: 1rem
    --slide-entrance: none
