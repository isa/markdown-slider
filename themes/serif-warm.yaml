# Warm serif — amber / stone palette
# Use in slides: theme: serif-warm

id: serif-warm
name: Serif warm
description: Georgia / Palatino headings, amber accents, stone backgrounds.

align: left

dark:
  css:
    --slide-font-heading: Georgia, "Times New Roman", serif
    --slide-font-body: Palatino, "Palatino Linotype", "Book Antiqua", serif
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 3.25rem
    --slide-font-size-h2: 2.5rem
    --slide-font-size-h3: 1.875rem
    --slide-font-size-body: 1.35rem
    --slide-line-height-body: "1.7"
    --slide-text: "#e7e5e4"
    --slide-text-muted: "#a8a29e"
    --slide-heading-color: "#fef3c7"
    --slide-heading-h1-color: "#fffbeb"
    --slide-heading-h2-color: "#fef3c7"
    --slide-heading-h3-color: "#fcd34d"
    --slide-accent: "#d97706"
    --slide-bg: transparent
    --slide-bullet-color: "#d97706"
    --slide-list-spacing: 0.85rem
    --slide-image-radius: 4px
    --slide-image-shadow: 0 20px 40px rgb(0 0 0 / 0.4)
    --slide-image-max-width: min(100%, 32rem)
    --slide-code-bg: "#292524"
    --slide-code-text: "#fcd34d"
    --slide-blockquote-border: "#d97706"
    --slide-table-border: "#57534e"
    --slide-table-header-bg: "#44403c"
    --slide-column-gap: 1.5rem
    --slide-entrance: none

light:
  css:
    --slide-font-heading: Georgia, "Times New Roman", serif
    --slide-font-body: Palatino, "Palatino Linotype", "Book Antiqua", serif
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 3.25rem
    --slide-font-size-h2: 2.5rem
    --slide-font-size-h3: 1.875rem
    --slide-font-size-body: 1.35rem
    --slide-line-height-body: "1.7"
    --slide-text: "#44403c"
    --slide-text-muted: "#78716c"
    --slide-heading-color: "#292524"
    --slide-heading-h1-color: "#1c1917"
    --slide-heading-h2-color: "#292524"
    --slide-heading-h3-color: "#57534e"
    --slide-accent: "#b45309"
    --slide-bg: transparent
    --slide-bullet-color: "#b45309"
    --slide-list-spacing: 0.85rem
    --slide-image-radius: 4px
    --slide-image-shadow: 0 12px 28px rgb(0 0 0 / 0.1)
    --slide-image-max-width: min(100%, 32rem)
    --slide-code-bg: "#fafaf9"
    --slide-code-text: "#a16207"
    --slide-blockquote-border: "#b45309"
    --slide-table-border: "#d6d3d1"
    --slide-table-header-bg: "#f5f5f4"
    --slide-column-gap: 1.5rem
    --slide-entrance: none
