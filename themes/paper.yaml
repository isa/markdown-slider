# Paper — print-like serif (light) + warm dark (dark app mode)
# Use in slides: theme: paper

id: paper
name: Paper
description: Light stone background for light UI; deep warm panel for dark UI.

align: left

dark:
  css:
    --slide-font-heading: Georgia, serif
    --slide-font-body: '"Iowan Old Style", "Palatino Linotype", serif'
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 2.75rem
    --slide-font-size-h2: 2rem
    --slide-font-size-h3: 1.5rem
    --slide-font-size-body: 1.15rem
    --slide-line-height-body: "1.65"
    --slide-text: "#e7e5e4"
    --slide-text-muted: "#a8a29e"
    --slide-heading-color: "#fafaf9"
    --slide-heading-h1-color: "#ffffff"
    --slide-heading-h2-color: "#fafaf9"
    --slide-heading-h3-color: "#d6d3d1"
    --slide-accent: "#fbbf24"
    --slide-bg: "#1c1917"
    --slide-bullet-color: "#fbbf24"
    --slide-list-spacing: 0.6rem
    --slide-image-radius: 0.5rem
    --slide-image-shadow: 0 16px 36px rgb(0 0 0 / 0.45)
    --slide-image-max-width: min(100%, 34rem)
    --slide-code-bg: "#292524"
    --slide-code-text: "#fde68a"
    --slide-blockquote-border: "#fbbf24"
    --slide-table-border: "#57534e"
    --slide-table-header-bg: "#44403c"
    --slide-column-gap: 1.25rem
    --slide-entrance: none

light:
  css:
    --slide-font-heading: Georgia, serif
    --slide-font-body: '"Iowan Old Style", "Palatino Linotype", serif'
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 2.75rem
    --slide-font-size-h2: 2rem
    --slide-font-size-h3: 1.5rem
    --slide-font-size-body: 1.15rem
    --slide-line-height-body: "1.65"
    --slide-text: "#292524"
    --slide-text-muted: "#57534e"
    --slide-heading-color: "#1c1917"
    --slide-heading-h1-color: "#0c0a09"
    --slide-heading-h2-color: "#1c1917"
    --slide-heading-h3-color: "#57534e"
    --slide-accent: "#b45309"
    --slide-bg: "#fafaf9"
    --slide-bullet-color: "#b45309"
    --slide-list-spacing: 0.6rem
    --slide-image-radius: 0.5rem
    --slide-image-shadow: 0 10px 30px rgb(0 0 0 / 0.12)
    --slide-image-max-width: min(100%, 34rem)
    --slide-code-bg: "#f5f5f4"
    --slide-code-text: "#15803d"
    --slide-blockquote-border: "#b45309"
    --slide-table-border: "#d6d3d1"
    --slide-table-header-bg: "#e7e5e4"
    --slide-column-gap: 1.25rem
    --slide-entrance: none
