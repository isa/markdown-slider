# Cardo + Roboto Serif

id: cardo-roboto-serif
name: Cardo + Roboto Serif
description: Classical serif headings, readable variable serif body.

dark:
  css:
    --slide-font-heading: '"Cardo", Georgia, "Times New Roman", serif'
    --slide-font-body: '"Roboto Serif", Georgia, serif'
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 3rem
    --slide-font-size-h2: 2.25rem
    --slide-font-size-h3: 1.75rem
    --slide-font-size-body: 1.25rem
    --slide-line-height-body: "1.625"

light:
  css:
    --slide-font-heading: '"Cardo", Georgia, "Times New Roman", serif'
    --slide-font-body: '"Roboto Serif", Georgia, serif'
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 3rem
    --slide-font-size-h2: 2.25rem
    --slide-font-size-h3: 1.75rem
    --slide-font-size-body: 1.25rem
    --slide-line-height-body: "1.625"
