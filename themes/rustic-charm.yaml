# Rustic Charm — cream, taupe, charcoal, near-black, rust (Montserrat + Nunito)
# Use: theme: rustic-charm

id: rustic-charm
name: Rustic Charm
description: Palette #FFFCF2 / #CCC5B9 / #403D39 / #252422 / #EB5E28; Montserrat headings, Nunito body.

align: left

dark:
  css:
    --slide-font-heading: '"Montserrat", system-ui, sans-serif'
    --slide-font-body: '"Nunito", system-ui, sans-serif'
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 3rem
    --slide-font-size-h2: 2.25rem
    --slide-font-size-h3: 1.75rem
    --slide-font-size-body: 1.25rem
    --slide-line-height-body: "1.625"
    --slide-text: "#FFFCF2"
    --slide-text-muted: "#CCC5B9"
    --slide-heading-color: "#FFFCF2"
    --slide-heading-h1-color: "#EB5E28"
    --slide-heading-h2-color: "#FFFCF2"
    --slide-heading-h3-color: "#CCC5B9"
    --slide-accent: "#EB5E28"
    --slide-bg: transparent
    --slide-bullet-color: "#EB5E28"
    --slide-list-spacing: 0.75rem
    --slide-image-radius: 0.75rem
    --slide-image-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.45)
    --slide-image-max-width: min(100%, 36rem)
    --slide-code-bg: "#252422"
    --slide-code-text: "#CCC5B9"
    --slide-blockquote-border: "#EB5E28"
    --slide-table-border: "#403D39"
    --slide-table-header-bg: "#403D39"
    --slide-column-gap: 1.25rem
    --slide-entrance: none

light:
  css:
    --slide-font-heading: '"Montserrat", system-ui, sans-serif'
    --slide-font-body: '"Nunito", system-ui, sans-serif'
    --slide-font-mono: ui-monospace, monospace
    --slide-font-size-h1: 3rem
    --slide-font-size-h2: 2.25rem
    --slide-font-size-h3: 1.75rem
    --slide-font-size-body: 1.25rem
    --slide-line-height-body: "1.625"
    --slide-text: "#252422"
    --slide-text-muted: "#403D39"
    --slide-heading-color: "#252422"
    --slide-heading-h1-color: "#EB5E28"
    --slide-heading-h2-color: "#252422"
    --slide-heading-h3-color: "#403D39"
    --slide-accent: "#EB5E28"
    --slide-bg: transparent
    --slide-bullet-color: "#EB5E28"
    --slide-list-spacing: 0.75rem
    --slide-image-radius: 0.75rem
    --slide-image-shadow: 0 20px 40px -12px rgb(37 36 34 / 0.12)
    --slide-image-max-width: min(100%, 36rem)
    --slide-code-bg: "#FFFCF2"
    --slide-code-text: "#252422"
    --slide-blockquote-border: "#EB5E28"
    --slide-table-border: "#CCC5B9"
    --slide-table-header-bg: "#FFFCF2"
    --slide-column-gap: 1.25rem
    --slide-entrance: none
