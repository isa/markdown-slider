<!DOCTYPE html>
<html data-theme="dark">
<head>
<style>
  html[data-theme="dark"] {
    --body-bg: #1a1a1a;
    --body-fg: #e5e5e5;
    --editor-bg: #2a2a2a;
    --ta-bg: #111;
    --ta-fg: #4ade80;
    --ta-border: #444;
    --out-bg: #111;
    --out-border: #333;
    --ok: #4ade80;
    --err: #f87171;
  }
  html[data-theme="light"] {
    --body-bg: #f4f4f5;
    --body-fg: #18181b;
    --editor-bg: #ffffff;
    --ta-bg: #fafafa;
    --ta-fg: #15803d;
    --ta-border: #d4d4d8;
    --out-bg: #fafafa;
    --out-border: #e4e4e7;
    --ok: #15803d;
    --err: #b91c1c;
  }
  body {
    margin: 0; padding: 2rem; font-family: 'Courier New', monospace;
    background: var(--body-bg); color: var(--body-fg);
  }
  .editor { background: var(--editor-bg); border-radius: 8px; padding: 1rem; margin-top: 1rem; border: 1px solid var(--out-border); }
  textarea {
    width: 100%; min-height: 120px; background: var(--ta-bg); color: var(--ta-fg);
    border: 1px solid var(--ta-border); border-radius: 6px; padding: 0.75rem;
    font-family: 'Courier New', monospace; font-size: 14px; resize: vertical;
  }
  button {
    margin-top: 0.75rem; padding: 0.5rem 1.25rem; background: #3b82f6;
    color: white; border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #2563eb; }
  #output {
    margin-top: 1rem; padding: 1rem; background: var(--out-bg); border-radius: 6px;
    border: 1px solid var(--out-border); min-height: 40px; white-space: pre-wrap;
  }
  #output.ok { color: var(--ok); }
  #output.err { color: var(--err); }
</style>
</head>
<body>
  <h2>⚡ Live Code Runner</h2>
  <div class="editor">
    <textarea id="code">function hello() {
  console.log("Hello, World!");
}
hello();</textarea>
    <button onclick="runCode()">▶ Run Code</button>
    <div id="output"></div>
  </div>
  <script>
    function runCode() {
      const code = document.getElementById('code').value;
      const output = document.getElementById('output');
      const oldLog = console.log;
      let logs = [];
      console.log = (...args) => logs.push(args.map(String).join(' '));
      try {
        eval(code);
        output.className = 'ok';
        output.textContent = logs.join('\n') || '(no output)';
      } catch (e) {
        output.className = 'err';
        output.textContent = '❌ ' + e.message;
      }
      console.log = oldLog;
    }
  </script>
</body>
</html>
