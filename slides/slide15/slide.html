<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML slide demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(145deg, #0f172a 0%, #1e3a5f 50%, #0c4a6e 100%);
        color: #e0f2fe;
        padding: 2rem;
      }
      .card {
        max-width: 36rem;
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(56, 189, 248, 0.35);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        color: #fff;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #bae6fd;
      }
      code {
        font-size: 0.9em;
        padding: 0.15em 0.4em;
        border-radius: 0.25rem;
        background: rgba(8, 47, 73, 0.9);
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>HTML slide (<code>slide.html</code>)</h1>
      <p>
        This entire slide is a normal HTML document loaded in an iframe—use it when you want custom layout, embedded widgets, or styles that go beyond the markdown theme system.
      </p>
    </div>
  </body>
</html>
