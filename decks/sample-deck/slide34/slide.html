<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML slide</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(120% 80% at 50% 20%, #1e293b 0%, #0f172a 45%, #020617 100%);
        color: #e2e8f0;
      }
      .panel {
        max-width: 40rem;
        padding: 2rem 2.25rem;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.65;
        color: #cbd5e1;
        font-size: 0.95rem;
      }
      code {
        font-size: 0.88em;
        padding: 0.15em 0.45em;
        border-radius: 0.35rem;
        background: rgba(30, 41, 59, 0.95);
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>HTML slide (<code>slide.html</code>)</h1>
      <p>
        This slide is a full HTML document rendered in an iframe. Use it for bespoke layout, embedded widgets, or styles outside the markdown theme pipeline.
      </p>
    </div>
  </body>
</html>
